[project]
name = "durable-orchestrator-demo"
version = "0.1.0"
description = "Registry-driven, durable multi-agent orchestrator on LangGraph / Agent Server (AI platform upgrade use case)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph-sdk>=0.2.0",
    "langsmith>=0.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=1.0.0", "langchain-openai>=1.0.0"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_orchestrator", "src/mock_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:`durability` has no effect:UserWarning"]
